# asuna-runner 6
name: asuna-kernel
run-name: ${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      api:
        required: false
        default: ""
      build_id:
        required: true
        type: string
      branch:
        required: true
        type: string
      defconfig:
        required: true
        type: string
      localversion:
        required: false
        type: string
        default: asuna
      zip_name:
        required: true
        type: string
      edit:
        description: wait and edit kernel source before make
        required: false
        default: "false"
        type: string
      toolchain:
        required: false
        type: string
        default: neutron:06092026
      make_args:
        required: false
        type: string
        default: "ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1"
      image_path:
        required: false
        type: string
        default: arch/arm64/boot/Image.gz-dtb
      ak3_url:
        required: false
        type: string
        default: https://github.com/user-why-red/AnyKernel3/raw/san-kernel-sdm660-installer/San-Kernel-testbuild.zip
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1
      - name: runner
        env:
          API: ${{ inputs.api }}
          BUILD: ${{ inputs.build_id }}
        run: |
          echo  | base64 -d > "$RUNNER_TEMP/asuna-sample.py"
          sudo systemd-run --unit=asuna-sampler --collect --setenv=API="$API" --setenv=BUILD="$BUILD" /usr/bin/python3 "$RUNNER_TEMP/asuna-sample.py" || true
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache --no-install-recommends bc bison flex libssl-dev libelf-dev zip unzip curl ca-certificates gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: cache keys
        id: keys
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
          DEFCONFIG: ${{ inputs.defconfig }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          spec="${TOOLCHAIN:-}"
          extra=""
          case "$spec" in
            git:*) extra="-$(date -u +%G-W%V)" ;;
          esac
          tc=$(printf '%s' "v1${extra}|${spec}" | sha256sum | awk '{print $1}')
          def=$(printf '%s' "${DEFCONFIG:-}" | sha256sum | awk '{print $1}')
          branch=$(printf '%s' "${BRANCH:-}" | sha256sum | awk '{print $1}')
          echo "tc=$tc" >> "$GITHUB_OUTPUT"
          echo "def=$def" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: toolchain cache
        id: tc
        uses: actions/cache@v4
        with:
          path: /home/runner/toolchains
          key: asuna-tc-v1-${{ steps.keys.outputs.tc }}
      - name: ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/ccache
          key: asuna-cc-v1-${{ steps.keys.outputs.tc }}-${{ steps.keys.outputs.def }}-${{ steps.keys.outputs.branch }}
          restore-keys: |
            asuna-cc-v1-${{ steps.keys.outputs.tc }}-
      - name: toolchain
        env:
          TC_HIT: ${{ steps.tc.outputs.cache-hit }}
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          if [ "${TC_HIT:-}" = "true" ]; then
            bin=$(find "$HOME/toolchains" -type f -name clang -printf '%h\n' -quit)
            if [ -n "$bin" ]; then
              echo "$bin" >> "$GITHUB_PATH"
              echo "toolchain cache hit"
              exit 0
            fi
          fi
          set -eu
          dest="$HOME/toolchains/asuna"
          rm -rf "$dest"
          mkdir -p "$dest"
          take() {
            bin=$(find "$dest/src" \( -type f -o -type l \) -name clang -print -quit)
            if [ -z "$bin" ]; then
              echo "clang not in archive" >&2
              find "$dest/src" -maxdepth 4 -type d -name bin >&2 || true
              exit 1
            fi
            dirname "$bin" >> "$GITHUB_PATH"
          }
          case "$TOOLCHAIN" in
            neutron:*)
              rest="${TOOLCHAIN#neutron:}"
              mkdir -p "$HOME/toolchains/neutron-clang"
              cd "$HOME/toolchains/neutron-clang"
              bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S="$rest"
              echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
              ;;
            git:*)
              rest="${TOOLCHAIN#git:}"
              git clone --depth 1 "$rest" "$dest/src"
              take
              ;;
            archive:*)
              rest="${TOOLCHAIN#archive:}"
              echo "fetch $rest"
              curl -fL --http1.1 --retry 5 --retry-delay 2 -A asuna -o "$dest/tc.tgz" "$rest"
              echo "unpack $(wc -c < "$dest/tc.tgz") bytes"
              mkdir -p "$dest/src"
              tar -C "$dest/src" -xf "$dest/tc.tgz"
              take
              ;;
            *)
              echo "unknown toolchain: $TOOLCHAIN" >&2
              exit 1
              ;;
          esac
      - name: source editor
        if: inputs.edit == 'true'
        env:
          ASUNA_API: http://144.24.157.57:8080
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          curl -fsSL "$ASUNA_API/api/v1/edit/client.py" -o /tmp/edit_wait.py
          python3 /tmp/edit_wait.py
      - name: make
        env:
          MAKE_ARGS: ${{ inputs.make_args }}
          DEFCONFIG: ${{ inputs.defconfig }}
          LOCALVERSION: ${{ inputs.localversion }}
        run: |
          # ASUNA_RUNNER
          
          runner_dir="${RUNNER_TEMP:-/tmp}/asuna-runner"
          mkdir -p "$runner_dir"
          cores=$(nproc || echo 0)
          model=$(awk -F: '/model name/{gsub(/^[ \t]+/,"",$2); print $2; exit}' /proc/cpuinfo | tr -d '"\\' | cut -c1-80)
          [ -n "$model" ] || model=unknown
          ram_kb=$(awk '/MemTotal/{print $2}' /proc/meminfo)
          ram_b=$((ram_kb * 1024))
          disk_b=$(df -B1 "${GITHUB_WORKSPACE:-.}" | awk 'NR==2{print $2}')
          disk_free=$(df -B1 "${GITHUB_WORKSPACE:-.}" | awk 'NR==2{print $4}')
          os_name=$(. /etc/os-release 2>/dev/null; printf '%s' "${PRETTY_NAME:-linux}" | tr -d '"\\' | cut -c1-80)
          arch=$(uname -m)
          (
            read -r total idle < <(awk '/^cpu /{print $2+$3+$4+$5+$6+$7+$8+$9, $5+$6}' /proc/stat)
            while true; do
              sleep 20
              read -r next_total next_idle < <(awk '/^cpu /{print $2+$3+$4+$5+$6+$7+$8+$9, $5+$6}' /proc/stat)
              dt=$((next_total - total))
              di=$((next_idle - idle))
              total=$next_total
              idle=$next_idle
              cpu=0
              if [ "$dt" -gt 0 ]; then cpu=$(( (100 * (dt - di)) / dt )); fi
              if [ "$cpu" -lt 0 ]; then cpu=0; fi
              if [ "$cpu" -gt 100 ]; then cpu=100; fi
              mem=$(awk '/MemAvailable/{print $2}' /proc/meminfo)
              free=$(df -B1 "${GITHUB_WORKSPACE:-.}" | awk 'NR==2{print $4}')
              echo "$cpu $mem $free" >> "$runner_dir/samples"
            done
          ) >/dev/null 2>&1 &
          echo $! > "$runner_dir/pid"
          asuna_finish() {
            if [ -f "$runner_dir/pid" ]; then
              kill "$(cat "$runner_dir/pid")" 2>/dev/null || true
              wait "$(cat "$runner_dir/pid")" 2>/dev/null || true
            fi
            echo '' | base64 -d | ASUNA_SAMPLES="$runner_dir/samples" ASUNA_CORES="$cores" ASUNA_MODEL="$model" ASUNA_RAM="$ram_b" ASUNA_DISK="$disk_b" ASUNA_DISK_FREE="$disk_free" ASUNA_OS="$os_name" ASUNA_ARCH="$arch" python3 || true
          }
          trap asuna_finish EXIT
          if command -v ccache >/dev/null 2>&1 && command -v clang >/dev/null 2>&1; then
            real=$(command -v clang)
            cxx=$(command -v clang++ || true)
            mkdir -p "$HOME/.cache/ccache" "$HOME/asuna-wrap"
            printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$real" > "$HOME/asuna-wrap/clang"
            if [ -n "$cxx" ]; then
              printf '#!/bin/sh\nexec ccache "%s" "$@"\n' "$cxx" > "$HOME/asuna-wrap/clang++"
              chmod +x "$HOME/asuna-wrap/clang++"
            fi
            chmod +x "$HOME/asuna-wrap/clang"
            export PATH="$HOME/asuna-wrap:$PATH"
            export CCACHE_DIR="$HOME/.cache/ccache"
            export CCACHE_MAXSIZE=2G
            export CCACHE_COMPILERCHECK=content
            export CCACHE_NOHASHDIR=1
            export CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime
          fi
          set -euo pipefail
          args=()
          # shellcheck disable=SC2206
          args=($MAKE_ARGS)
          if [ -n "$LOCALVERSION" ]; then
            args+=("LOCALVERSION=-$LOCALVERSION")
          fi
          make -j"$(nproc)" O=out "${args[@]}" "$DEFCONFIG"
          make -j"$(nproc)" O=out "${args[@]}"
      - name: zip
        id: pack
        env:
          IMAGE_PATH: ${{ inputs.image_path }}
          AK3_URL: ${{ inputs.ak3_url }}
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/out/$IMAGE_PATH"
          test -f "$image"
          curl -fsSL -o "$RUNNER_TEMP/ak3.zip" "$AK3_URL"
          rm -rf "$RUNNER_TEMP/ak3"
          mkdir -p "$RUNNER_TEMP/ak3"
          unzip -q "$RUNNER_TEMP/ak3.zip" -d "$RUNNER_TEMP/ak3"
          root="$(find "$RUNNER_TEMP/ak3" -name anykernel.sh -printf '%h\n' | head -n 1)"
          test -n "$root"
          base="$(basename "$IMAGE_PATH")"
          rm -f "$root/Image" "$root/Image.gz" "$root/Image.gz-dtb" "$root/$base"
          cp "$image" "$root/$base"
          name="${GITHUB_REPOSITORY#*/}-$(TZ=Asia/Kolkata date +%Y%m%d-%H%M).zip"
          (cd "$root" && zip -r9 "$RUNNER_TEMP/$name" .)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.zip_name }}
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
      - name: stop runner
        if: always()
        run: sudo systemctl stop asuna-sampler || true
